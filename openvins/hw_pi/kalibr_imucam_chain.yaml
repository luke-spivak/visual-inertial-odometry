%YAML:1.0
# Kalibr camera-IMU result, 2026-09-14 (results/kalibr_imucam_2026-09-14-*),
# on the new sensor plate (grommet mount, 15 deg tilt). T_imu_cam = inverse of
# Kalibr's T_cam_imu: 180 deg about the camera's y axis + 1.4 deg; IMU sits
# ~29 mm behind the camera along the optical axis. Intrinsics unchanged from
# 2026-09-10.
cam0:
  T_imu_cam:
    - [-0.999918663, -0.012669127, -0.001470011, -0.000621192]
    - [-0.012696196,  0.999716201,  0.020157486, -0.000665856]
    - [ 0.001214216,  0.020174510, -0.999795737, -0.029323399]
    - [ 0.000000000,  0.000000000,  0.000000000,  1.000000000]
  cam_overlaps: []
  camera_model: pinhole
  distortion_model: equidistant
  distortion_coeffs: [-0.13882140193931888, 0.09386935808666856, -0.2575836766879479, 0.25417910356302265]
  intrinsics: [1115.3088888227155, 1115.9573063140713, 597.9970163233057, 419.1590855596645]
  resolution: [1280, 800]
  rostopic: /cam0/image_raw
  timeshift_cam_imu: 0.0018133558455517397   # t_imu = t_cam + shift
