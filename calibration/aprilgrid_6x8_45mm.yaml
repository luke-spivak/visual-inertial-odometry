# Kalibr target description for the Aprilgrid generated by
#   rosrun kalibr kalibr_create_target_pdf --type apriltag \
#     --nx 6 --ny 8 --tsize 0.045 --tspace 0.3 aprilgrid_6x8_45mm.pdf
#
# tagSize is deliberately left unfilled. 0.045 is what was REQUESTED; what
# matters is what the printer produced. A target printed at 99 % scale puts a
# 1 % error straight into focal length, and it will not look like an error:
# reprojection error stays low because the model is internally consistent,
# just wrong. Until this holds a measured number it does not parse, so Kalibr
# refuses to run on it rather than quietly using the requested size.
#
# How to measure (outer black edge to outer black edge of the whole pattern):
#   across:  tagSize = span / 8.1    (6 tags + 7 gaps of 0.3)
#   down:    tagSize = span / 10.7   (8 tags + 9 gaps of 0.3)
# Seven gaps across, not five: Kalibr's grid puts a small black square, one
# gap wide, at every tag corner INCLUDING the outer perimeter, so the pattern's
# outer edge sits one gap beyond the outermost tags on each side. Confirmed by
# rasterizing this PDF: its outermost row is seven 13.5 mm squares. The first
# version of these divisors ignored them; see aprilgrid_5x7_25mm.yaml for what
# that would have done to a correct print.
# Do BOTH. Printers routinely scale the feed and cross directions differently,
# and Kalibr models square tags: if the two values disagree by more than
# ~0.2 %, the print is anisotropic and will bias fx against fy -- reprint
# rather than average.
target_type: 'aprilgrid'
tagCols: 6
tagRows: 8
tagSize: MEASURE_ME   # metres, one tag's black square edge, as printed
tagSpacing: 0.3       # gap / tag size; a ratio, so uniform print scaling cancels
