# Kalibr target description for the US Letter Aprilgrid generated by
#   rosrun kalibr kalibr_create_target_pdf --type apriltag \
#     --nx 5 --ny 7 --tsize 0.025 --tspace 0.3 aprilgrid_5x7_25mm.pdf
# Page 175.4 x 240.4 mm, ~20 mm margins on Letter. The fallback for when the
# A2 / 18x24" poster target (aprilgrid_6x8_45mm) cannot be printed.
#
# The trade: focus is locked at infinity, so near objects are soft -- about
# 1 px of blur at 0.9 m, 2 px at 0.5 m, 3 px at 0.3 m at full resolution. A
# Letter sheet far enough away to be sharp covers ~10 % of the frame width, so
# this target is used closer and blurrier than the poster. Tags are 25 mm, the
# largest a Letter page allows, to keep them detectable through that blur.
#
# tagSize is the MEASURED size, not the requested one. A 99 % print puts a 1 %
# error into every metric distance Kalibr solves -- a stereo baseline, and in
# step 6 the camera-IMU lever arm -- and it will not look like an error. It
# does NOT touch focal length: scale the target and every distance together
# and the images are identical, so the intrinsics cannot see it. It shipped as an unparseable MEASURE_ME so that Kalibr could not
# run until someone had put a rule on the print.
#
# How to measure (outer black edge to outer black edge of the whole pattern):
#   across:  tagSize = span / 6.8    (5 tags + 6 gaps of 0.3)
#   down:    tagSize = span / 9.4    (7 tags + 8 gaps of 0.3)
# Six gaps across, not four: Kalibr's grid puts a small black square, one gap
# wide, at every tag corner INCLUDING the outer perimeter, so the pattern's
# outer edge sits one gap beyond the outermost tags on each side. Confirmed by
# rasterizing this PDF: its outermost row is six 7.5 mm squares. The first
# version of these divisors ignored them, and would have turned a perfect print
# into 27.4 / 26.7 mm -- every metric distance ~10 % too large, plus
# a false 2.7 % anisotropy that looked like printer scaling.
# Do BOTH. Printers routinely scale feed and cross directions differently, and
# Kalibr models square tags: if the two disagree by more than ~0.2 %, the print
# is anisotropic and will bias fx against fy -- reprint rather than average.
target_type: 'aprilgrid'
tagCols: 5
tagRows: 7
tagSize: 0.025        # measured 2026-09-10: 170 mm across / 6.8 = 25.0, 235 mm down / 9.4 = 25.0.
                      # Rule reading, ~0.5 % resolution: re-measure to the mm to tighten fx/fy.
tagSpacing: 0.3       # gap / tag size; a ratio, so uniform print scaling cancels
