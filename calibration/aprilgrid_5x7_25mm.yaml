# Kalibr target description for the US Letter Aprilgrid generated by
#   rosrun kalibr kalibr_create_target_pdf --type apriltag \
#     --nx 5 --ny 7 --tsize 0.025 --tspace 0.3 aprilgrid_5x7_25mm.pdf
# Page 175.4 x 240.4 mm, ~20 mm margins on Letter. The fallback for when the
# A2 / 18x24" poster target (aprilgrid_6x8_45mm) cannot be printed.
#
# The trade: focus is locked at infinity, so near objects are soft -- about
# 1 px of blur at 0.9 m, 2 px at 0.5 m, 3 px at 0.3 m at full resolution. A
# Letter sheet far enough away to be sharp covers ~10 % of the frame width, so
# this target is used closer and blurrier than the poster. Tags are 25 mm, the
# largest a Letter page allows, to keep them detectable through that blur.
#
# tagSize is deliberately left unfilled. 0.025 is what was REQUESTED; what
# matters is what the printer produced. A 99 % print puts a 1 % error straight
# into focal length, and it will not look like an error: reprojection error
# stays low because the model is internally consistent, just wrong. Until this
# holds a measured number it does not parse, so Kalibr refuses to run on it.
#
# How to measure (calipers, outer black edge to outer black edge):
#   across the 5 columns:  tagSize = span / 6.2    (5 tags + 4 gaps of 0.3)
#   down the 7 rows:       tagSize = span / 8.8    (7 tags + 6 gaps of 0.3)
# Do BOTH. Printers routinely scale feed and cross directions differently, and
# Kalibr models square tags: if the two disagree by more than ~0.2 %, the print
# is anisotropic and will bias fx against fy -- reprint rather than average.
target_type: 'aprilgrid'
tagCols: 5
tagRows: 7
tagSize: MEASURE_ME   # metres, one tag's black square edge, as printed
tagSpacing: 0.3       # gap / tag size; a ratio, so uniform print scaling cancels
