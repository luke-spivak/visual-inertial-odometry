# ros_gz_bridge config: Gazebo (gz-transport) -> ROS 2, for the VIO payload.
#
#   ros2 run ros_gz_bridge parameter_bridge \
#     --ros-args -p config_file:=sim/gazebo/ros_gz_bridge_vio.yaml
#
# Topics are remapped to OpenVINS' usual names (/cam0/image_raw, /imu0) so the
# sim estimator config stays a small delta from euroc_mav rather than a rewrite.
#
# Note the VIO IMU is bridged, NOT iris_with_standoffs' imu_sensor -- that one
# belongs to ArduPilot SITL. See docs/development-log.md "Sim harness".

- ros_topic_name: "/imu0"
  gz_topic_name: "/world/iris_runway/model/iris_with_vio/link/vio_link/sensor/vio_imu/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

- ros_topic_name: "/cam0/image_raw"
  gz_topic_name: "/world/iris_runway/model/iris_with_vio/link/vio_link/sensor/vio_camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/cam0/camera_info"
  gz_topic_name: "/world/iris_runway/model/iris_with_vio/link/vio_link/sensor/vio_camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# Ground truth for evo, from the OdometryPublisher attached to the model in the
# world file. NOT from dynamic_pose/info: gz fills in entity names and a stamp
# there, but ros_gz_bridge's Pose_V -> TFMessage conversion delivers empty frame
# ids and stamp 0. That failure is silent -- the bag records thousands of
# well-formed, useless messages -- so it is worth stating why this topic exists.
- ros_topic_name: "/gz/ground_truth"
  gz_topic_name: "/gz/ground_truth"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS
