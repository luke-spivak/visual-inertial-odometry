# ros_gz_bridge config: Gazebo (gz-transport) -> ROS 2, for the VIO payload.
#
#   ros2 run ros_gz_bridge parameter_bridge \
#     --ros-args -p config_file:=$HOME/vio_gazebo/ros_gz_bridge_vio.yaml
#
# Topics are remapped to OpenVINS' usual names (/cam0/image_raw, /imu0) so the
# sim estimator config stays a small delta from euroc_mav rather than a rewrite.
#
# Note the VIO IMU is bridged, NOT iris_with_standoffs' imu_sensor -- that one
# belongs to ArduPilot SITL. See PROJECT.md "Sim harness".

- ros_topic_name: "/imu0"
  gz_topic_name: "/world/iris_runway/model/iris_with_vio/link/vio_link/sensor/vio_imu/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

- ros_topic_name: "/cam0/image_raw"
  gz_topic_name: "/world/iris_runway/model/iris_with_vio/link/vio_link/sensor/vio_camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/cam0/camera_info"
  gz_topic_name: "/world/iris_runway/model/iris_with_vio/link/vio_link/sensor/vio_camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# Ground truth for evo. Pose_V carries every link in the world; the estimator
# is compared against the vio_link entry.
- ros_topic_name: "/gz/pose_info"
  gz_topic_name: "/world/iris_runway/dynamic_pose/info"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS
